[pytest]
# ============================================================
# UNIPARKING — Configuración Pytest
# Proyecto de grado — Ingeniería de Sistemas — UNIMETA 2026
# ============================================================

testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados
markers =
    positivo: Caso de prueba positivo (datos válidos)
    negativo: Caso de prueba negativo (datos inválidos o erróneos)
    navegacion: Prueba de navegación entre páginas
    autenticacion: Prueba de inicio/cierre de sesión
    formulario: Prueba de formularios y campos
    validacion: Prueba de validaciones de datos
    acceso: Prueba de control de acceso
    tarifas: Prueba relacionada con tarifas y planes
    pago: Prueba del flujo de pago
    cesion: Prueba del módulo de cesión de plazas
    mapa: Prueba del mapa del parqueadero
    anpr: Prueba del módulo ANPR
    admin: Prueba del panel administrativo

# Opciones de ejecución
addopts =
    -v
    --tb=short

# Nivel de logs
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
